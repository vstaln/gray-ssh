[package]
name = "gray-ssh"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
description = "ssh_run/ssh_copy tools delegating shell + scp to remote hosts. Port of pi's ssh extension."

[[bin]]
name = "gray-ssh"
path = "src/main.rs"

[dependencies]
serde_json = "1"

[profile.release]
strip = true
